<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Process-Steps — HQ Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../styles.css">

<body>
<div class="eyebrow"><span class="n">Components</span><span>Process Steps</span></div>
<div class="steps" style="grid-template-columns:repeat(4,1fr);margin-top:24px">
  <div class="step"><div class="idx">01</div><div class="en">Site Survey</div><h3 class="cjk">現況掃描</h3><p class="cjk">AI 識圖丈量、現地條件建檔。</p><span class="tag">AI</span></div>
  <div class="step"><div class="idx">02</div><div class="en">Parametric Design</div><h3 class="cjk">參數化方案</h3><p class="cjk">條件驅動產出多組可比較方案。</p><span class="tag">Parametric</span></div>
  <div class="step"><div class="idx">03</div><div class="en">Design Intent</div><h3 class="cjk">設計意圖定案</h3><p class="cjk">確認目標、品牌語彙與使用情境。</p></div>
  <div class="step"><div class="idx">04</div><div class="en">Technical Validation</div><h3 class="cjk">技術驗證</h3><p class="cjk">尺度、材料、法規與可行性。</p></div>
</div>
