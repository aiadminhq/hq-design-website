<!-- @dsCard group="Foundations" name="Neutrals" subtitle="Navy 10 階 + 語意層（bg／fg／line）· 雙主題" viewport="700x360" -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Neutrals — HQ Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../styles.css">
<style>body{padding:32px;background:var(--bg)}.dsc{max-width:100%}</style>
</head>
<body>
<div class="dsc">
<div class="eyebrow"><span class="n">Foundations</span><span>Neutrals &amp; Semantic</span></div>
<h3 class="cjk" style="margin-top:16px">HQ Navy 與語意層</h3>
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:24px">
<div style="background:var(--p-navy-050);height:48px"></div><div style="background:var(--p-navy-100);height:48px"></div><div style="background:var(--p-navy-300);height:48px"></div><div style="background:var(--p-navy-400);height:48px"></div><div style="background:var(--p-navy-500);height:48px"></div><div style="background:var(--p-navy-700);height:48px"></div><div style="background:var(--p-navy-800);height:48px"></div><div style="background:var(--p-navy-900);height:48px"></div></div>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:24px;font-size:14px">
  <div><b class="mono">背景</b><ul style="list-style:none;padding:0;line-height:1.9;color:var(--fg-2)">
    <li>--bg 頁面底</li><li>--bg-sunken 下沉區</li><li>--bg-inverse 深色反轉</li><li>--bg-immersive 沉浸深色</li></ul></div>
  <div><b class="mono">前景與線</b><ul style="list-style:none;padding:0;line-height:1.9;color:var(--fg-2)">
    <li>--fg / --fg-2 / --fg-3 三階</li><li>--line 髮絲線</li><li>--line-ink 墨線（區塊上緣）</li></ul></div>
</div>
</div>
</body>
</html>
