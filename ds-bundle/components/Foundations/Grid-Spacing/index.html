<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Grid-Spacing — HQ Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../styles.css">
<style>body{padding:32px;background:var(--bg)}.dsc{max-width:100%}</style>
</head>
<body>
<div class="dsc">
<div class="eyebrow"><span class="n">Foundations</span><span>Grid &amp; Spacing</span></div>
<h3 class="cjk" style="margin-top:16px">Swiss 12 欄</h3>
<div class="grid" style="margin-top:20px"><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div><div style="background:var(--bg-sunken);border-top:1px solid var(--line-ink);height:48px;grid-column:span 1"></div></div>
<p class="small mono" style="margin-top:16px">--container 1320｜--gutter 24｜--s1 4 → --s10 128｜--section-y clamp(72px,8vw,150px)</p>
<p class="small cjk" style="margin-top:8px">影像一律 3:2。9 欄配置得 984/1.5 = 656px = 8×82，完全貼合 8px 節奏；<b>避免 8 欄</b>（581.3px 脫離節奏）。</p>
</div>
</body>
</html>
