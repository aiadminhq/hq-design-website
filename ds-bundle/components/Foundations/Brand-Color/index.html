<!-- @dsCard group="Foundations" name="Brand-Color" subtitle="HQ Vermillion #D64518 · 8 階 · 單頁像素上限 10%" viewport="700x300" -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Brand-Color — HQ Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../styles.css">
<style>body{padding:32px;background:var(--bg)}.dsc{max-width:100%}</style>
</head>
<body>
<div class="dsc">
<div class="eyebrow"><span class="n">Foundations</span><span>Brand Color</span></div>
<h3 class="cjk" style="margin-top:16px">HQ Vermillion — 品牌唯一英雄色</h3>
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:24px">
<div style="background:var(--p-verm-050);height:56px"></div><div style="background:var(--p-verm-100);height:56px"></div><div style="background:var(--p-verm-300);height:56px"></div><div style="background:var(--p-verm-400);height:56px"></div><div style="background:var(--p-verm-500);height:56px"></div><div style="background:var(--p-verm-600);height:56px"></div></div>
<p class="small" style="margin-top:16px">400 (#D64518) 為 <code class="mono">--brand</code>。其餘階僅用於 hover／pressed／subtle。<b>單頁橘紅像素佔比 MUST ≤ 10%</b>（<code class="mono">--hq-ratio-brand-max</code>）。</p>
</div>
</body>
</html>
