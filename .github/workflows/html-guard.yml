name: HTML guard
on:
  push:
    branches: [main]
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pages must be complete (>= 2 KB, closed </html>)
        run: |
          set -e; fail=0
          while IFS= read -r f; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 2048 ]; then echo "::error file=$f::only $size bytes — page looks truncated"; fail=1; fi
            if ! grep -q '</html>' "$f"; then echo "::error file=$f::missing </html>"; fail=1; fi
          done < <(git ls-files -- ':(glob)*.html' ':(glob)projects/*.html' ':(glob)zh/*.html' ':(glob)zh/projects/*.html')
          exit $fail
      - name: SEO head layer is in sync with titles/descriptions
        run: python3 scripts/legacy-seo/apply_seo_layer.py --check
